# Fly.io config for the dmgr-web Go backend.
# Deploy:  cd backend && fly launch --copy-config --now   (or: fly deploy)
# Pick a unique app name when prompted (e.g. dmgr-web-<you>).
app = "dmgr-web-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_DIR = "/data"

# Persist counts.json across restarts.
[mounts]
  source = "dmgr_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "5s"
