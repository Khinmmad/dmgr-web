# Render.com blueprint for the Go backend (free plan, no credit card).
# Deploy: render.com -> New -> Blueprint -> pick this repo (Khinmmad/dmgr-web).
#
# Note: the free plan has no persistent disk, so the download counters reset on
# each deploy/restart, and the service sleeps after ~15 min idle (cold start).
# For persistent counters, switch `plan: free` to `plan: starter` and add a disk
# (see the commented block below).
services:
  - type: web
    name: dmgr-web-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /healthz
    autoDeploy: true
    # For persistent counts (paid plan), uncomment:
    # plan: starter
    # disk:
    #   name: data
    #   mountPath: /data
    #   sizeGB: 1
